<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Titre / description / canonical / og:url sont RÉÉCRITS PAR ROUTE au build
         par scripts/prerender.mjs. Ce fichier porte les valeurs de l'accueil. -->
    <title>ProFund builds and invests in AI-native companies</title>
    <meta name="description" content="A €35M early-stage fund acting as Lead investor at seed stage and co-investing in Series A. Domain-specific AI harness, detected 24/7 before they become obvious." />
    <link rel="canonical" href="https://profund.vc/" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta property="og:site_name" content="ProFund" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ProFund - Self-Improving AI Venture Platform" />
    <meta property="og:description" content="Self-Improving AI Venture Platform" />
    <meta property="og:url" content="https://profund.vc/" />
    <meta property="og:image" content="https://profund.vc/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ProFund - Self-Improving AI Venture Platform" />
    <meta name="twitter:description" content="Self-Improving AI Venture Platform" />
    <meta name="twitter:image" content="https://profund.vc/og-cover.png" />

    <!-- La police Inter est chargée par un @import en tête de src/index.css
         (comme sur la version Zite). Le preconnect supprime l'aller-retour DNS/TLS
         de la chaîne de chargement, sans changer le rendu. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>ProFund — AI-Native Venture Platform</h1>
      <p>
        A €35M early-stage fund acting as Lead investor at seed stage and co-investing in Series A.
        Targeting domain-specific AI harness with self-improving loops built by highly technical AI-native teams.
        Powered by an in-house AI sourcing platform that reads 24/7 weak signals in emerging categories and detects founders matching our thesis before they become obvious to the category.
      </p>
      <p>Contact: <a href="mailto:alexandre@profund.vc">alexandre@profund.vc</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
