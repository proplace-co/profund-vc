<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 533 33" role="img" aria-label="Maximum Insurance">
  <title>Maximum Insurance</title>
  <!-- Wordmark MAXIMUM [+ croix rouge] INSURANCE, SUR UNE LIGNE.
       La boite est ajustee au TRACE : hauteur = hauteur de capitale exacte
       d'Arial Bold 44 (0,717 em), largeur = somme des largeurs mesurees. Aucune
       marge morte, donc le logo se cale au pixel sur le bord de sa colonne et
       ses capitales font la meme hauteur que celles du logo Proplace voisin.
       Positions calculees sur les metriques reelles, jamais estimees.
       Fond transparent. -->
  <g font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="800"
     font-size="44" letter-spacing="-1" fill="#201e1d">
    <text x="0" y="31.5">MAXIMUM</text>
    <g transform="translate(229.1, 1.5)">
      <rect width="30" height="30" fill="#ec3013"/>
      <rect x="12" y="5" width="6" height="20" fill="#ffffff"/>
      <rect x="5" y="12" width="20" height="6" fill="#ffffff"/>
    </g>
    <text x="279.1" y="31.5">INSURANCE</text>
  </g>
</svg>
