<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 563 34" role="img" aria-label="Maximum Insurance">
  <title>Maximum Insurance</title>
  <!-- Wordmark MAXIMUM [+ croix rouge] INSURANCE, sur une ligne, boite ajustee
       au trace. `textLength` + `lengthAdjust` FORCENT chaque mot a la largeur
       calculee : sans cela le rendu depend de la police de repli du visiteur
       (Archivo est rarement installe) et le « E » d'INSURANCE sortait du
       viewBox, donc etait coupe. Ici la geometrie est deterministe.
       Le viewBox porte 5 % de marge a droite : filet de securite si un
       moteur ignorait textLength. Fond transparent. -->
  <g font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="800"
     font-size="44" fill="#201e1d">
    <text x="0" y="32.5" textLength="209.1" lengthAdjust="spacingAndGlyphs">MAXIMUM</text>
    <g transform="translate(231.1, 2.0)">
      <rect width="30" height="30" fill="#ec3013"/>
      <rect x="12" y="5" width="6" height="20" fill="#ffffff"/>
      <rect x="5" y="12" width="20" height="6" fill="#ffffff"/>
    </g>
    <text x="283.1" y="32.5" textLength="253.5" lengthAdjust="spacingAndGlyphs">INSURANCE</text>
  </g>
</svg>
